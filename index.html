   note:"武蔵野の雑木林が残る都立の植物公園。ばら園は約400種5,200株。大温室は熱帯植物を集めた屋内施設で、夏は室温が上がる。",
   map:"https://maps.google.com/?cid=9763061280357406539"},
  {id:"suisei", area:"park", panel:"a", noFood:true, genres:["spot","natsu"], name:"水生植物園", shade:"water",

   note:"神代植物公園の園内カフェ。深大寺養蜂園のはちみつを使ったカレーが名物。屋内席とテラス席があり、先に注文して席で待つ方式。",

  {id:"anand", area:"chofu", panel:"b", genres:["kori"], name:"甘味an&", shade:"in",

   note:"季節の素材を使ったかき氷。氷の中にも具が仕込まれる。抹茶あずきで1,300円ほど。あんみつなどの甘味もある。あずきや安藤の姉妹店で、2022年開店。",

  {id:"azukiya", area:"chofu", panel:"b", genres:["kori","dango"], name:"あずきや安藤", shade:"sun",
   status:"open", rating:"4.0 / 207件", hours:"毎日 10:30–18:30",
   note:"北海道産の小豆を銅釜で炊いた粒あんの今川焼と、かき氷。生地に黒ごまが入る。今川焼は200円ほど。テイクアウト専門で席はない。",

   note:"妖怪をモチーフにした甘味とグッズの店。グッズは350種類以上。深大寺の参道にあった店舗は2024年8月に閉店し、同年11月に天神通りへ移転した。7月からかき氷を出す。",

   note:"クマの形のかき氷で知られる専門店。メニューは日替わりで6種ほど。LINEか電話で予約できる。調布駅から徒歩10分弱。",

   status:"open", rating:"4.7 / 131件", hours:"金 11:30–19:00（火・水休）",
   note:"焼き芋の専門店。さつまいものスムージーやスープ、大福もある。イートインの席がある。",
   map:"https://www.google.com/maps/search/?api=1&query=おいものおうち+調布店"}

const AREAS = [
  {id:"sando", name:"深大寺・参道", sub:"バス停「深大寺」下車"},
  {id:"park",  name:"神代植物公園", sub:"バス停「神代植物公園前」下車"},
  {id:"chofu", name:"調布駅前・天神通り", sub:"京王線 調布駅 北口"}
];
const GENRES = [
  {id:"all",   label:"すべて"},
  {id:"natsu", label:"夏"},
  {id:"soba",  label:"蕎麦"},
  {id:"dango", label:"茶菓"},
  {id:"kori",  label:"かき氷"},
  {id:"spot",  label:"見所"}
];
const SHADE_LABEL = {in:"屋内", shade:"木陰・外席", water:"水辺", sun:"日向あり"};
const STATUS = {
  open:  {cls:"st-open",   label:"8/14 営業"},
  closed:{cls:"st-closed", label:"8/14 休み"},
  check: {cls:"st-check",  label:"8/14 要確認"}
};
/* noFood: 飲食店ではないもの。食べログのボタンを出さない */
const BY_ID = Object.fromEntries(SHOPS.map(s => [s.id, s]));

/* 営業時間の中の電話番号をタップできるようにする */
function linkTel(text){
  return text.replace(/0\d{1,3}-\d{2,4}-\d{4}/g,
    m => `<a href="tel:${m.replace(/-/g, "")}">${m}</a>`);
}


const listEl  = document.getElementById("list");
const emptyEl = document.getElementById("empty");
const rowEl   = document.getElementById("tabs-row");
let current = "all";

/* ---- タブ ---- */
rowEl.innerHTML = GENRES.map(g => {
  const n = g.id === "all" ? SHOPS.length : SHOPS.filter(s => s.genres.includes(g.id)).length;
  return `<button data-genre="${g.id}" aria-pressed="${g.id === "all"}">${g.label}<span class="tab-n">${n}</span></button>`;
}).join("");


/* ---- 表示切り替え ---- */
function visible(){ return SHOPS.filter(s => current === "all" || s.genres.includes(current)); }


function cardHtml(s){
  const st = STATUS[s.status];
  const label = s.statusText || st.label;
  const tabelog = s.noFood ? "" :
    `<a href="${s.tabelog || ("https://www.google.com/search?q=" + encodeURIComponent(s.name + " 深大寺 食べログ"))}" target="_blank" rel="noopener">食べログ</a>`;
  const rating = s.rating ? `<span class="card-rating">${s.rating}</span>` : "";
  return `
    <article class="card shade-${s.shade}" data-id="${s.id}" id="c-${s.id}">
      <div class="card-top">
        <h3 class="card-name">${s.name}</h3>
        ${rating}
      </div>
      <span class="status ${st.cls}">${label} <small>／ ${SHADE_LABEL[s.shade]}</small></span>
      <p class="card-note">${s.note}</p>
      <p class="hours">${linkTel(s.hours)}${s.pinWith ? "　／　" + BY_ID[s.pinWith].name + " と同じ場所" : ""}</p>
      <div class="links">
        <a href="${s.map}" target="_blank" rel="noopener">Googleマップ</a>
        ${tabelog}
      </div>
    </article>`;
}

function render(){
  let total = 0;
  listEl.innerHTML = AREAS.map(area => {
    const items = visible().filter(s => s.area === area.id);
    if(!items.length) return "";
    total += items.length;
    return `<section class="area">
        <div class="area-head"><h2>${area.name}</h2><span class="area-sub">${area.sub}</span></div>
        <div class="area-rule"></div>
        ${items.map(cardHtml).join("")}
      </section>`;
  }).join("");
  emptyEl.hidden = total > 0;
}

rowEl.addEventListener("click", e => {
  const btn = e.target.closest("button");
  if(!btn) return;
  current = btn.dataset.genre;
  rowEl.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
  render();
});



render();

</script>
</body>
</html>
